{% extends 'base.html' %}
{% load static %}

{% block header_title %}Phishing Scanner{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
    <!-- Input Section -->
    <div class="glass-panel rounded-xl flex flex-col h-full overflow-hidden">
        <div class="p-4 border-b border-slate-700 bg-slate-800/50">
            <h3 class="font-semibold text-lg flex items-center gap-2">
                <i class="fa-solid fa-code text-blue-400"></i> Suspicious Content
            </h3>
        </div>
        <div class="p-6 flex-1 flex flex-col gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Suspicious URL (Optional)</label>
                <input type="text" class="w-full bg-slate-800 border border-slate-600 rounded-md p-3 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. http://paypal-secure.tk/login">
            </div>
            <div class="flex-1 flex flex-col">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Email Body or Message</label>
                <textarea class="w-full flex-1 bg-slate-800 border border-slate-600 rounded-md p-3 text-white focus:outline-none focus:border-blue-500 resize-none" placeholder="Paste the suspicious content here..."></textarea>
            </div>
            <button class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md transition-colors mt-2">
                <i class="fa-solid fa-magnifying-glass mr-2"></i> Run AI Analysis
            </button>
        </div>
    </div>

    <!-- Output Section -->
    <div class="glass-panel rounded-xl flex flex-col h-full overflow-hidden">
        <div class="p-4 border-b border-slate-700 bg-slate-800/50">
            <h3 class="font-semibold text-lg flex items-center gap-2">
                <i class="fa-solid fa-microchip text-blue-400"></i> AI Verdict
            </h3>
        </div>
        <div class="p-6 flex-1 flex items-center justify-center text-slate-500">
            <div class="text-center">
                <i class="fa-solid fa-shield-halved text-5xl mb-4"></i>
                <p>Waiting for scan input...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
