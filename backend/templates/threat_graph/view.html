{% extends 'base.html' %}
{% load static %}

{% block header_title %}Threat Graph Visualizer{% endblock %}

<div class="glass-panel rounded-xl flex flex-col h-[600px] overflow-hidden">
    <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">

        <div class="text-center text-slate-500">
