{% load static %}
<!DOCTYPE html>
<html lang="en" class="transition-colors duration-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DEFENCESYS</title>

    <!-- Tailwind Config & Engine -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'monospace'],
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Theme Switcher (Immediate execute in head) -->
    <script src="{% static 'js/theme_toggle.js' %}"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }

        /* Subtle grid background */
        .bg-grid-pattern {
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        }
        .dark .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        @keyframes card-rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-enter { animation: card-rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 transition-colors duration-200">

    <!-- Ambient glow & grid accents -->
    <div class="absolute inset-0 bg-grid-pattern pointer-events-none z-0"></div>
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-indigo-500/10 dark:bg-indigo-600/15 blur-3xl pointer-events-none z-0"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-violet-500/10 dark:bg-violet-600/15 blur-3xl pointer-events-none z-0"></div>

    <!-- Top Navigation Controls -->
    <div class="absolute top-5 right-5 z-20 flex items-center gap-3">
        <button id="theme-toggle-btn"
                class="p-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100 shadow-sm hover:shadow transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500"
                aria-label="Toggle dark/light theme"
                title="Toggle theme">
            <i id="theme-toggle-icon" class="fa-solid fa-moon text-sm"></i>
        </button>
    </div>

    <!-- Card Container -->
    <div class="card-enter max-w-md w-full bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800/80 rounded-2xl shadow-xl p-8 backdrop-blur-md relative z-10 transition-colors duration-200">

        <!-- Header & Brand Logo -->
        <div class="flex flex-col items-center text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-zinc-800 border border-indigo-200 dark:border-zinc-700 flex items-center justify-center shadow-sm mb-3">
                <i class="fa-solid fa-shield-halved text-indigo-600 dark:text-indigo-400 text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-zinc-100">
                DEFENCE<span class="text-indigo-600 dark:text-indigo-400">SYS</span>
            </h1>
            <p class="text-[10px] font-mono uppercase tracking-widest text-slate-400 dark:text-zinc-500 mt-0.5">
                SOC · Tier-1 Security Operations
            </p>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-2">
                Sign in to access your security intelligence command center
            </p>
        </div>

        <!-- Error Alert -->
        {% if error %}
        <div class="flex items-center gap-3 p-3.5 mb-6 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs shadow-xs">
            <i class="fa-solid fa-circle-exclamation text-rose-500 flex-shrink-0 text-sm"></i>
            <span class="font-medium">{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'auth:login' %}{% if next %}?next={{ next }}{% endif %}" class="space-y-4" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 dark:text-zinc-300 mb-1.5">
                    Analyst Username
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-zinc-500 text-xs">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <input id="username"
                           name="username"
                           type="text"
                           autocomplete="username"
                           required
                           class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-100 dark:bg-zinc-800/50 border border-slate-300 dark:border-zinc-700/60 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-xs"
                           placeholder="your_username">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-zinc-300">
                        Password
                    </label>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-zinc-500 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required
                           class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-100 dark:bg-zinc-800/50 border border-slate-300 dark:border-zinc-700/60 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-xs"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition-all transform active:scale-95 text-xs flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-zinc-900 mt-2">
                <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                <span>Sign in to SOC Dashboard</span>
            </button>
        </form>

        <!-- Register Link -->
        <div class="mt-6 pt-5 border-t border-slate-100 dark:border-zinc-800 text-center">
            <p class="text-xs text-slate-500 dark:text-zinc-400">
                No analyst account yet?
                <a href="{% url 'auth:register' %}" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline ml-1">Create one</a>
            </p>
        </div>

        <!-- Hardware Security Telemetry Footer -->
        <div class="flex items-center justify-center gap-2 mt-4 text-[11px] font-mono text-slate-400 dark:text-zinc-500">
            <i class="fa-solid fa-lock text-[10px] text-emerald-500"></i>
            <span>Hardware Attested · ECDSA SECP256R1 Active</span>
        </div>
    </div>

</body>
</html>
