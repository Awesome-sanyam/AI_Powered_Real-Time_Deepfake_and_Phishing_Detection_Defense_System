{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DEFENCESYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }

        /* Light base */
        :root {
            --bg:      #f8fafc;
            --surface: #ffffff;
            --border:  #e2e8f0;
            --accent:  #3b82f6;
            --text:    #0f172a;
            --muted:   #64748b;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-enter { animation: slide-up 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }

        .input-field {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1.5px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        .btn-primary {
            width: 100%;
            padding: 0.625rem;
            background: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        }
        .btn-primary:hover  { background: #1d4ed8; box-shadow: 0 4px 12px rgba(37,99,235,0.35); }
        .btn-primary:active { transform: scale(0.98); }
    </style>
</head>
<body style="background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">

    <div class="card-enter w-full" style="max-width: 400px;">

        <!-- Logo mark -->
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="display:inline-flex; align-items:center; justify-content:center; width:3rem; height:3rem; background:#eff6ff; border:1.5px solid #bfdbfe; border-radius:0.75rem; margin-bottom:0.75rem;">
                <i class="fa-solid fa-shield-halved" style="color:#3b82f6; font-size:1.25rem;"></i>
            </div>
            <h1 style="font-size:1.125rem; font-weight:700; letter-spacing:-0.01em;">DEFENCE<span style="color:#3b82f6;">SYS</span></h1>
            <p style="font-size:0.8rem; color:var(--muted); margin-top:0.25rem;">AI Security Platform — SOC Login</p>
        </div>

        <!-- Card -->
        <div style="background:var(--surface); border:1.5px solid var(--border); border-radius:1rem; padding:2rem; box-shadow:0 4px 24px rgba(0,0,0,0.06);">

            <h2 style="font-size:1.125rem; font-weight:600; margin-bottom:0.375rem;">Sign in to your account</h2>
            <p style="font-size:0.8rem; color:var(--muted); margin-bottom:1.5rem;">Enter your credentials to access the SOC Dashboard.</p>

            {% if error %}
            <div style="display:flex; align-items:center; gap:0.5rem; background:#fef2f2; border:1px solid #fecaca; border-radius:0.5rem; padding:0.75rem 1rem; margin-bottom:1.25rem; font-size:0.8rem; color:#dc2626;">
                <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'auth:login' %}{% if next %}?next={{ next }}{% endif %}" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div style="margin-bottom:1rem;">
                    <label for="username" style="display:block; font-size:0.8rem; font-weight:500; margin-bottom:0.375rem;">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username"
                           class="input-field" placeholder="your_username" required>
                </div>

                <div style="margin-bottom:1.5rem;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.375rem;">
                        <label for="password" style="font-size:0.8rem; font-weight:500;">Password</label>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                           class="input-field" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right:0.375rem;"></i>
                    Sign in
                </button>
            </form>
        </div>

        <!-- Register link -->
        <p style="text-align:center; font-size:0.8rem; color:var(--muted); margin-top:1.25rem;">
            No account yet?
            <a href="{% url 'auth:register' %}" style="color:#3b82f6; font-weight:500; text-decoration:none;">Create one</a>
        </p>
    </div>

</body>
</html>
