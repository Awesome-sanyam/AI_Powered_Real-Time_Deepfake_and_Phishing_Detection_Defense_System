name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1 — Backend syntax & settings validation
  # ───────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "django>=4.2,<5.0" \
            "djangorestframework>=3.15" \
            "django-cors-headers>=4.3" \
            "channels>=4.0" \
            "celery>=5.4" \
            "cryptography>=42.0" \
            "python-dotenv>=1.0" \
            "httpx>=0.27" \
            "pyflakes>=3.0"

      - name: Pyflakes — config package (file-by-file to avoid wildcard issues)
        working-directory: backend
        run: |
          python -m pyflakes config/__init__.py
          python -m pyflakes config/asgi.py
          python -m pyflakes config/celery.py
          python -m pyflakes config/urls.py
          python -m pyflakes config/wsgi.py
          python -m pyflakes config/settings/__init__.py
          python -m pyflakes config/settings/base.py
          # development.py and production.py use 'from config.settings.base import *'
          # which is standard Django practice. We validate them via the settings
          # load check below instead of pyflakes (which can't resolve star imports).
          echo "Config pyflakes: PASSED"

      - name: Pyflakes — app packages
        working-directory: backend
        run: |
          python -m pyflakes apps/core/
          python -m pyflakes apps/deepfake/
          python -m pyflakes apps/phishing/
          python -m pyflakes apps/identity/
          python -m pyflakes apps/threat_graph/
          python -m pyflakes routing.py
          echo "App pyflakes: PASSED"

      - name: Django settings load (no DB required)
        working-directory: backend
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          # Validate that settings can be imported without a live DB or Redis
          from config.settings.base import (
              INSTALLED_APPS,
              MIDDLEWARE,
              DATABASES,
              CHANNEL_LAYERS,
              CELERY_BROKER_URL,
              AI_ENGINE_BASE_URL,
              NEO4J_URI,
          )
          assert 'apps.deepfake' in INSTALLED_APPS
          assert 'apps.phishing' in INSTALLED_APPS
          assert 'apps.identity' in INSTALLED_APPS
          assert 'apps.threat_graph' in INSTALLED_APPS
          print('Django settings load: PASSED')
          print('INSTALLED_APPS:', [a for a in INSTALLED_APPS if a.startswith('apps.')])
          "

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 — AI engine unit tests (pure Python, no GPU deps)
  # ───────────────────────────────────────────────────────────────────────────
  ai-engine-tests:
    name: AI Engine Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI engine CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "cryptography>=42.0" \
            "numpy>=1.26" \
            "python-dotenv>=1.0" \
            "pyflakes>=3.0"

      - name: Pyflakes — pure-Python AI engine modules
        run: |
          python -m pyflakes ai_engine/__init__.py
          python -m pyflakes ai_engine/identity/ecdsa_service.py
          python -m pyflakes ai_engine/phishing/url_forensics.py
          echo "AI engine pyflakes: PASSED"

      - name: Test — ECDSA sign, verify, tamper detection
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ai_engine.identity.ecdsa_service import ECDSAService

          svc = ECDSAService()

          # Round-trip sign + verify
          sig, pub = svc.sign('test-payload-hackathon')
          assert ECDSAService.verify(pub, 'test-payload-hackathon', sig), \
              'Valid signature must verify'

          # Tamper detection
          assert not ECDSAService.verify(pub, 'tampered-payload', sig), \
              'Tampered payload must be rejected'

          # Two different instances produce different keys
          svc2 = ECDSAService()
          sig2, pub2 = svc2.sign('test-payload-hackathon')
          assert pub != pub2, 'Different instances must have different keys'

          print('ECDSA tests: PASSED')
          print('  - sign + verify:      OK')
          print('  - tamper detection:   OK')
          print('  - key isolation:      OK')
          "

      - name: Test — URL forensics detection accuracy
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ai_engine.phishing.url_forensics import URLForensics

          f = URLForensics()

          # High-risk: suspicious TLD + brand impersonation + no HTTPS
          r = f.analyze('http://paypal-secure.tk/verify/account')
          assert r['risk_score'] >= 0.5, f'Expected >= 0.5, got {r[\"risk_score\"]}'
          assert len(r['signals']) >= 2, f'Expected >= 2 signals, got {r[\"signals\"]}'
          print(f'Phishing URL  risk={r[\"risk_score\"]:.2f}  signals={r[\"signals\"]}')

          # High-risk: IP hostname
          r2 = f.analyze('http://192.168.1.1/admin/login')
          assert r2['risk_score'] > 0, 'IP hostname must flag as risky'
          print(f'IP URL        risk={r2[\"risk_score\"]:.2f}  signals={r2[\"signals\"]}')

          # Low-risk: clean HTTPS domain
          r3 = f.analyze('https://github.com/Awesome-sanyam')
          assert r3['risk_score'] == 0.0, f'Clean URL must have 0 risk, got {r3[\"risk_score\"]}'
          print(f'Clean URL     risk={r3[\"risk_score\"]:.2f}  signals={r3[\"signals\"]}')

          print('URL forensics tests: PASSED')
          "

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 — Repository structure validation
  # ───────────────────────────────────────────────────────────────────────────
  structure-check:
    name: Structure Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify all required files are present
        run: |
          missing=0
          check() {
            if [ -f "$1" ]; then
              echo "  OK  $1"
            else
              echo "  MISSING  $1"
              missing=$((missing + 1))
            fi
          }

          echo "=== Core ==="
          check "About.md"
          check ".env.example"
          check ".gitignore"
          check "docker-compose.yml"

          echo "=== Backend ==="
          check "backend/manage.py"
          check "backend/requirements.txt"
          check "backend/routing.py"
          check "backend/config/__init__.py"
          check "backend/config/asgi.py"
          check "backend/config/celery.py"
          check "backend/config/wsgi.py"
          check "backend/config/urls.py"
          check "backend/config/settings/base.py"
          check "backend/config/settings/development.py"
          check "backend/config/settings/production.py"
          check "backend/apps/core/__init__.py"
          check "backend/apps/deepfake/consumers.py"
          check "backend/apps/deepfake/tasks.py"
          check "backend/apps/phishing/tasks.py"
          check "backend/apps/identity/services.py"
          check "backend/apps/threat_graph/graph_client.py"

          echo "=== AI Engine ==="
          check "ai_engine/requirements.txt"
          check "ai_engine/server.py"
          check "ai_engine/config.py"
          check "ai_engine/deepfake/cross_modal_engine.py"
          check "ai_engine/identity/ecdsa_service.py"
          check "ai_engine/phishing/llm_analyzer.py"
          check "ai_engine/phishing/url_forensics.py"

          echo "=== Scripts & Models ==="
          check "scripts/setup_env.sh"
          check "scripts/run_dev.sh"
          check "scripts/download_models.sh"
          check "models/README.md"

          echo ""
          if [ $missing -gt 0 ]; then
            echo "FAILED: $missing file(s) missing"
            exit 1
          fi
          echo "All files present: PASSED"

      - name: Verify scripts are executable
        run: |
          for s in scripts/setup_env.sh scripts/run_dev.sh scripts/download_models.sh; do
            [ -x "$s" ] && echo "  executable  $s" || { echo "  NOT executable  $s"; exit 1; }
          done
          echo "Script permissions: PASSED"

      - name: Python syntax check — all .py files
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f" && echo "  OK  $f" || { echo "  FAIL  $f"; failed=$((failed+1)); }
          done < <(find backend ai_engine -name "*.py" -print0)

          if [ $failed -gt 0 ]; then
            echo "FAILED: $failed file(s) have syntax errors"
            exit 1
          fi
          echo "Syntax check: PASSED"
